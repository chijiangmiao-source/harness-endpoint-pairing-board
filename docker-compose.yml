services:
  # 页面服务：宿主端口可用环境变量 WEB_PORT 覆盖，默认 8080
  page:
    build: .
    image: harness-wiring-board
    ports:
      - "${WEB_PORT:-8080}:4173"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # 一次性验收服务：跑 Playwright（含鼠标拖拽与键盘选择链路）后退出
  verify:
    image: harness-wiring-board
    build: .
    # 与 page 共享网络命名空间，用回环地址直达页面服务。
    # 不能用 http://page:4173：新版 Chromium 会把无点单标签主机名自动升级为
    # HTTPS（ERR_SSL_PROTOCOL_ERROR），而本页面仅提供 HTTP；环回地址属于该
    # 升级机制的规范豁免。回环同时也不会触发 vite preview 的 Host 白名单。
    network_mode: "service:page"
    environment:
      # 指向同一网络命名空间内的 page 服务；设置后 Playwright 不再自起服务器
      BASE_URL: http://127.0.0.1:4173
    depends_on:
      page:
        condition: service_healthy
    # 一次性运行，退出码即验收结果
    command: ["npx", "playwright", "test"]
    restart: "no"
